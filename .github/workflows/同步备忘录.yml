name: 自动同步 Star 备忘录

on:
  schedule:
    # 每 30 分钟自动巡检一次（UTC 时间每半小时）
    - cron: '*/30 * * * *'
  # 随时在网页端保留手动触发按钮
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须具备写权限，否则无法自动提交更新

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装基础依赖
        run: pip install requests

      - name: 运行同步与排版脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_stars.py

      - name: 自动提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md stars_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动同步 Star 清单与优化排版" && git push)
